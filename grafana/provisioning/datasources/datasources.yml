apiVersion: 1

datasources:
  # PostgreSQL datasource (for Airflow metadata)
  - name: PostgreSQL-Airflow
    type: postgres
    access: proxy
    url: postgres:5432
    database: airflow
    user: airflow
    secureJsonData:
      password: airflow
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1300
      timescaledb: false

  # Redis datasource (for Airflow Celery backend)
  - name: Redis-Airflow
    type: redis-datasource
    access: proxy
    url: redis:6379
    editable: true
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0

  # Kafka datasource (if you want to visualize Kafka metrics directly)
  - name: Kafka
    type: kafka-datasource
    access: proxy
    url: kafka:29092
    editable: true
    jsonData:
      kafkaVersion: "3.6.0"
      saslMechanism: ""
      securityProtocol: "PLAINTEXT"
      timeout: 10