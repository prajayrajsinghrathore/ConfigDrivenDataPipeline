[pytest]
# Pytest configuration for Config-Driven Data Pipeline

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    contract: Contract/schema validation tests
    dag: Airflow DAG integrity tests
    integration: Integration tests (requires Docker services)
    e2e: End-to-end tests (requires full stack)
    performance: Performance/load tests
    slow: Slow running tests

# Default options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage settings (requires pytest-cov)
# Run with: pytest --cov=dags --cov-report=html

# Ignore deprecation warnings from third-party libraries
filterwarnings =
    # ignore::DeprecationWarning:airflow.*
    # ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:airflow.*
