x-airflow-common:
  &airflow-common
  # Using optimised multi-stage build image
  image: configdrivenpipeline:latest
  build: ..
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    # SECURITY: Secrets loaded from .env file (Airflow 3.1.6 best practice)
    # Generate fernet_key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_INTERNAL_API_SECRET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-jufTTgomWVtn03bObP7RcUv2qcpOfM6nl5FhIvpvCa4=}
    AIRFLOW__API_AUTH__JWT_ISSUER: 'airflow'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    
    # Metrics configuration
    AIRFLOW__METRICS__STATSD_ON: 'false'

    # Kubernetes specific settings
      # ADD THESE LINES for Kubernetes configuration
    KUBECONFIG: '/opt/airflow/.kube/config'
    AIRFLOW__KUBERNETES__IN_CLUSTER: 'false'
    AIRFLOW__KUBERNETES__KUBERNETES_IN_CLUSTER: 'false'
    AIRFLOW__KUBERNETES__CONFIG_FILE: '/opt/airflow/.kube/config'
    
    # Kafka Configuration
    KAFKA_TOPIC_MARKET_DATA: 'market-data'
    KAFKA_SECURITY_PROTOCOL: 'PLAINTEXT'
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
    
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    #_PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/docker/airflow.cfg'
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../config:/opt/airflow/config:ro
    - ../tests:/opt/airflow/tests:ro
    - .:/opt/airflow/docker:ro
    - ../plugins:/opt/airflow/plugins:ro
    # Development files for easy package management
    #- ../requirements.txt:/requirements.txt
    # Kubernetes file
    - ~/.kube:/opt/airflow/.kube:ro
    # Environment file
    - .env:/opt/airflow/.env:ro
    
  user: "${AIRFLOW_UID:-50000}:0"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    # DHI hardened image from ACR
    image: dhi.io/postgres:18-alpine3.23-dev
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    # DHI hardened image from ACR
    image: dhi.io/redis:8-debian-dev
    container_name: redis
    command: redis-server --save 20 1 --loglevel warning --protected-mode no
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/public/version')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8974/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        # `python -m celery`: the DHI base image does not expose the `celery` console script on PATH
        - 'python -m celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "=== Migrating Database ==="
        echo
        airflow db migrate
        echo
        echo "=== Creating admin user (custom init bypasses entrypoint _AIRFLOW_WWW_USER_CREATE) ==="
        echo
        airflow users create \
            --username "$${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
            --password "$${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
            --firstname Admin --lastname User --role Admin \
            --email admin@example.com 2>/dev/null || echo "admin user exists"
        echo
        echo "=== Creating data-steward role for HITL approval workflow ==="
        echo
        # FAB resource names verified against ab_view_menu on Airflow 3.3.0 /
        # FAB provider 3.7.1: 'HITL Detail', 'DAGs', 'DAG Runs', 'Task Instances'.
        # Reads cover the 3.2.1 /dags endpoint requirements; can_edit on
        # 'HITL Detail' allows responding to approval tasks.
        airflow roles create data-steward 2>/dev/null || echo "data-steward role exists"
        airflow roles add-perms data-steward -a can_read \
            -r 'DAGs' 'DAG Runs' 'Task Instances' 'HITL Detail' 'Website'
        airflow roles add-perms data-steward -a can_edit -r 'HITL Detail'
        airflow users create \
            --username "$${_AIRFLOW_STEWARD_USERNAME:-steward}" \
            --password "$${_AIRFLOW_STEWARD_PASSWORD:-steward}" \
            --firstname Data --lastname Steward --role data-steward \
            --email steward@example.com 2>/dev/null || echo "steward user exists"
        echo
        echo "=== Pre-seeding Connections ==="
        echo
        airflow connections add 'kafka_default' \
            --conn-type 'kafka' \
            --conn-extra '{"bootstrap.servers": "kafka:29092", "security.protocol": "PLAINTEXT"}' 2>/dev/null || echo "kafka_default exists"
            
        airflow connections add 'smtp_default' \
            --conn-type 'smtp' \
            --conn-host 'smtp.example.com' \
            --conn-port '587' \
            --conn-login 'user' \
            --conn-password 'pass' 2>/dev/null || echo "smtp_default exists"
            
        airflow connections add 'snowflake_default' \
            --conn-type 'snowflake' \
            --conn-extra '{"account": "test_account", "warehouse": "test_wh", "database": "test_db", "region": "us-east-1"}' 2>/dev/null || echo "snowflake_default exists"
            
        airflow connections add 'sftp_default' \
            --conn-type 'sftp' \
            --conn-host 'sftp.example.com' \
            --conn-login 'user' \
            --conn-password 'pass' 2>/dev/null || echo "sftp_default exists"
        echo

        echo "=== Airflow initialization complete ==="

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    container_name: flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Kafka Service (Native KRaft mode - Kafka 4.x, no Zookeeper)
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-4.1.1
    container_name: kafka
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/kafka/data
        chown -R 1001:1001 /var/lib/kafka/data
        sed -i 's|log.dirs=.*|log.dirs=/var/lib/kafka/data|g' /opt/kafka/config/server.properties
        CLUSTER_ID=$$(bin/kafka-storage.sh random-uuid)
        rm -rf /var/lib/kafka/data/*
        bin/kafka-storage.sh format --standalone -t $$CLUSTER_ID -c /opt/kafka/config/server.properties
        chown -R 1001:1001 /var/lib/kafka/data
        su -s /bin/sh -c 'exec bin/kafka-server-start.sh /opt/kafka/config/server.properties \
          --override advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092 \
          --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT \
          --override listeners=PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092 \
          --override inter.broker.listener.name=PLAINTEXT \
          --override controller.listener.names=CONTROLLER \
          --override node.id=1 \
          --override process.roles=broker,controller' kafka
    environment:
      LOG_DIR: /tmp/logs
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Kafka Topic Initialization
  kafka-init:
    image: quay.io/strimzi/kafka:latest-kafka-4.1.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: [
      "sh", "-c",
      "echo 'Creating Kafka topics...' &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic market-data &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic pipeline-events &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic data-quality &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --config retention.ms=2592000000 --topic openlineage.events &&
       echo 'Topics created successfully'"
    ]
    restart: "no"
    profiles:
      - init

  # Kowl (Kafka UI)
  kowl:
    image: quay.io/cloudhut/kowl:v1.5.0
    container_name: kowl
    restart: always
    ports:
      - "8082:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TLS_ENABLED: false
      KAFKA_SASL_ENABLED: false
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # DATA LINEAGE - Marquez (OpenLineage Backend)
  # =============================================================================
  # Marquez provides local visualization of data lineage events.
  # It consumes from the openlineage.events Kafka topic.
  # External tools like Solidatus can also consume from the same topic.
  #
  # Access Marquez UI at: http://localhost:3001
  # Access Marquez API at: http://localhost:5000
  # =============================================================================

  # Marquez PostgreSQL Database
  marquez-db:
    # DHI hardened image from ACR
    image: dhi.io/postgres:18-alpine3.23-dev
    container_name: marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquez"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - lineage

  # Marquez API Server
  marquez-api:
    image: marquezproject/marquez:0.51.1
    container_name: marquez-api
    ports:
      - "5000:5000"   # API
      - "5001:5001"   # Admin
    environment:
      - MARQUEZ_CONFIG=/etc/marquez/marquez.yml
      - MARQUEZ_PORT=5000
      - MARQUEZ_ADMIN_PORT=5001
    volumes:
      - ./marquez.yml:/etc/marquez/marquez.yml
    depends_on:
      marquez-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/namespaces"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - lineage

  # Marquez Web UI
  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: marquez-web
    ports:
      - "3001:3000"
    environment:
      - MARQUEZ_HOST=marquez-api
      - MARQUEZ_PORT=5000
    depends_on:
      marquez-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - lineage

volumes:
  postgres-db-volume:
  kafka-data:
  marquez-db-volume:
