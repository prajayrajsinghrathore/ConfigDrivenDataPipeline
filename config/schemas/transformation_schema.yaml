# Transformation_schema.yaml with external file support

transformation:
  optional_fields:
    - column_types
    - new_columns
    - filters
    - aggregations
    - joins
    - external_transforms  # New field for external transformations

# Existing transformation types
column_types:
  allowed_types:
    - string
    - int
    - float
    - datetime
    - boolean

new_columns:
  supported_operations:
    - "field.str.upper()"
    - "field.str.lower()"
    - "pd.Timestamp.now()"
    - "field1 * field2"
    - "field1 + field2"
    - "field1 + ' -- ' + field2"
    - "abs(field)"
    - "field.dt.year"

filters:
  supported_conditions:
    - "> value"
    - "< value"
    - ">= value"
    - "<= value"
    - "!= value"
    - "== value"

aggregations:
  supported_functions:
    - sum
    - mean
    - count
    - min
    - max
    - std
    - median

# New external transformation configuration
external_transforms:
  supported_types:
    - python_file
    - beam_yaml
    - custom_function
  
  python_file:
    required_fields:
      - file_path
      - function_name
    optional_fields:
      - parameters
      - imports
      - dependencies
  
  beam_yaml:
    required_fields:
      - yaml_config
    optional_fields:
      - parameters
  
  custom_function:
    required_fields:
      - function_code
    optional_fields:
      - parameters
      - imports