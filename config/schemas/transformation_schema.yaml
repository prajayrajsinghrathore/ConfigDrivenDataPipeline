# Schema for the unified pipeline transformations list.
#
# `transformations` is an ORDERED list of steps executed sequentially by
# rlam_airflow_framework.transformers.apply_pipeline_transformations. Each
# step is a dict with a `type` key selecting the Transformer strategy
# (rlam_airflow_framework/transformers/) plus whatever fields that
# transformer reads. Because it's one list, manipulations and enrichments
# can be freely interleaved - e.g. filter *after* a Snowflake lookup.
#
# Example:
#   transformations:
#     - type: type_cast
#       columns:
#         trade_date: datetime
#         quantity: float
#     - type: snowflake_lookup
#       connection_id: snowflake-default
#       table: REFERENCE.INSTRUMENTS
#       join_on: {instrument_id: INSTRUMENT_ID}
#       select_columns: [ISIN, SECTOR]
#     - type: formula
#       columns:
#         total_value: quantity * price
#     - type: filter
#       condition: "quantity > 0"

transformations:
  supported_types:
    - type_cast
    - formula
    - filter
    - aggregation
    - snowflake_lookup

type_cast:
  # TypeCastTransformer (rlam_airflow_framework/transformers/type_cast.py)
  # Format: columns: {column_name: dtype}
  fields:
    columns:
      type: object
      required: true
      description: "Map of column name -> target dtype"
  allowed_types:
    - string
    - int
    - float
    - datetime
    - boolean

formula:
  # FormulaTransformer (rlam_airflow_framework/transformers/formula.py)
  # Format: columns: {new_column_name: formula}
  # Formulas use the safe Formula Engine with whitelisted functions.
  #
  # Available functions:
  #
  # MATH FUNCTIONS:
  #   - abs(value)                    : Absolute value
  #   - round(value, decimals)        : Round to decimals
  #   - min(a, b, ...)                : Minimum value
  #   - max(a, b, ...)                : Maximum value
  #   - pow(base, exp)                : Power/exponent
  #
  # STRING FUNCTIONS:
  #   - upper(string)                 : Convert to uppercase
  #   - lower(string)                 : Convert to lowercase
  #   - strip(string)                 : Remove whitespace
  #   - trim(string)                  : Remove whitespace (alias)
  #   - left(string, n)               : First n characters
  #   - right(string, n)              : Last n characters
  #   - substring(string, start, end) : Extract substring
  #   - concat(str1, str2, ...)       : Concatenate strings
  #   - replace(string, old, new)     : Replace substring
  #   - contains(string, substring)   : Check contains
  #   - length(string)                : String length
  #
  # DATE/TIME FUNCTIONS:
  #   - now()                         : Current datetime
  #   - today()                       : Current date
  #   - year(date)                    : Extract year
  #   - month(date)                   : Extract month
  #   - day(date)                     : Extract day
  #   - format_date(date, format)     : Format as string
  #   - date_diff(d1, d2, unit)       : Date difference
  #
  # NULL HANDLING:
  #   - coalesce(val1, val2, ...)     : First non-null value
  #   - ifnull(value, default)        : Default if null
  #   - is_null(value)                : Check if null
  #   - is_not_null(value)            : Check if not null
  #
  # CONDITIONAL FUNCTIONS:
  #   - if_else(cond, true_val, false_val) : Conditional
  #   - case_when(c1, v1, c2, v2, default) : Multiple conditions
  #   - between(value, low, high)          : Range check
  #   - in_list(value, list)               : List membership
  #
  # TYPE CONVERSION:
  #   - to_string(value)              : Convert to string
  #   - to_int(value)                 : Convert to integer
  #   - to_float(value)               : Convert to float
  #   - to_date(value, format)        : Convert to date
  #
  # ARITHMETIC OPERATORS:
  #   +, -, *, /, //, %, **
  #
  # COMPARISON OPERATORS:
  #   ==, !=, <, >, <=, >=
  #
  # LOGICAL OPERATORS:
  #   and, or, not
  #
  # Examples:
  fields:
    columns:
      type: object
      required: true
      description: "Map of new/overwritten column name -> formula expression"
  examples:
    - "quantity * price"                              # Multiplication
    - "price - cost"                                  # Subtraction
    - "(price - cost) / price * 100"                  # Complex math
    - "upper(customer_name)"                          # Uppercase
    - "concat(first_name, ' ', last_name)"            # Concatenation
    - "now()"                                         # Current timestamp
    - "if_else(amount > 1000, 'HIGH', 'LOW')"         # Conditional
    - "coalesce(preferred_name, first_name, 'N/A')"   # Null handling
    - "year(order_date)"                              # Extract year
    - "round(total_amount, 2)"                        # Rounding


filter:
  # FilterTransformer (rlam_airflow_framework/transformers/filter.py)
  # Format: condition: <boolean formula expression>
  # One condition per step; chain multiple `filter` steps for multiple
  # conditions. Evaluated via the same safe Formula Engine as `formula`.
  fields:
    condition:
      type: string
      required: true
      description: "Boolean formula expression, e.g. 'quantity > 0'"
  examples:
    - "quantity > 0"
    - "status == 'ACTIVE'"
    - "between(amount, 0, 1000)"

aggregation:
  # AggregationTransformer (rlam_airflow_framework/transformers/aggregation.py)
  # Format: aggregations: {function: [columns]}
  # Collapses the DataFrame to a single summary row; output columns are
  # named "{column}_{function}".
  fields:
    aggregations:
      type: object
      required: true
      description: "Map of aggregate function -> list of columns"
  supported_functions:
    - sum
    - mean
    - count
    - min
    - max
    - std
    - median

snowflake_lookup:
  # SnowflakeLookupTransformer (rlam_airflow_framework/transformers/enrichments/snowflake.py)
  # Enriches the DataFrame with columns looked up from a Snowflake table,
  # via a SQL-injection-safe IN-list query on `join_on`.
  required_fields:
    - table
    - join_on
    - select_columns
  optional_fields:
    - connection_id
  fields:
    connection_id:
      type: string
      required: false
      default: "snowflake-default"
      description: "Airflow connection ID for Snowflake"
    table:
      type: string
      required: true
      description: "Fully-qualified Snowflake table name, e.g. REFERENCE.INSTRUMENTS"
    join_on:
      type: object
      required: true
      description: "Single-entry map of {local_dataframe_column: snowflake_column}"
    select_columns:
      type: array
      required: true
      description: "Snowflake columns to pull into the DataFrame"

custom_transform:
  # Execute custom transformation logic from an external Python file.
  # Use this for complex business logic that cannot be expressed in formulas.
  #
  # NOTE: not yet implemented as a Transformer strategy - documented for
  # forward compatibility only.
  #
  # The Python file must contain a function that:
  #   - Takes a polars DataFrame as first argument
  #   - Returns a polars DataFrame
  #   - Can accept additional keyword arguments from 'kwargs'
  #
  # Example config:
  #   - type: custom_transform
  #     python_file: "transforms/order_processing.py"
  #     function: "apply_business_rules"
  #     kwargs:
  #       region: "EMEA"
  #       apply_discounts: true
  #
  # Example Python file (transforms/order_processing.py):
  #   def apply_business_rules(df, region='DEFAULT', apply_discounts=False):
  #       # Your custom logic here
  #       if apply_discounts:
  #           df['final_price'] = df['price'] * 0.9
  #       df['region'] = region
  #       return df
  #
  fields:
    python_file:
      type: string
      required: true
      description: "Path to Python file (relative to /opt/airflow/dags or absolute)"
    function:
      type: string
      required: false
      default: "transform"
      description: "Name of the function to call"
    kwargs:
      type: object
      required: false
      description: "Keyword arguments to pass to the function"
