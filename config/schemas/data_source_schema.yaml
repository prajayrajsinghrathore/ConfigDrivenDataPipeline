# This defines the structure and rules for YAML config files

# Basic validation rules - can be extended without changing code
required_fields:
  - metadata      # NEW: Required for multi-tenancy
  - data_source
  - destination

# =============================================================================
# METADATA SECTION (REQUIRED)
# =============================================================================
# Every pipeline MUST specify tenant ownership for multi-tenancy support.
# This enables resource isolation, connection mapping, and Kafka namespacing.
#
# Structure:
#   metadata:
#     tenant: "team_alpha"        # Required - must match tenant in global_settings
#     owner: "custom-owner"       # Optional - overrides tenant default owner
#     description: "Pipeline for X"  # Optional - pipeline description
#
metadata:
  required_fields:
    - tenant
  optional_fields:
    - owner
    - description
    - labels
    - rerun_with_latest_version
  
  tenant:
    type: string
    description: "Tenant identifier - must exist in global_settings.tenants"
    required: true
  
  owner:
    type: string
    description: "Optional owner override (defaults to tenant owner)"
  
  description:
    type: string
    description: "Human-readable description of the pipeline"
  
  labels:
    type: object
    description: "Custom key-value labels for categorization"
    
  rerun_with_latest_version:
    type: boolean
    default: false
    description: "Whether DAG run retries should execute using the latest DAG version rather than the bound historical version (Airflow 3 feature)."

data_source:
  required_fields:
    - name
    - type
    - endpoint  # for rest_api type
  allowed_types:
    - rest_api
    - sftp
  
  optional_fields:
    - connection_id
    - remote_path
    - file_pattern
    - file_format
    - processing_mode
    - authentication
    - request_config

authentication:
  allowed_types:
    - oauth
    - bearer_token
    - api_key
    - none
  optional_fields:
    - credentials
    - token_url
    - client_id
    - client_secret

destination:
  required_fields:
    - primary
  optional_fields:
    - backup
    - archive
    - secondary
    - summary
    - post_processing
    - quarantine  # For data quality invalid records
  
  # Quarantine destination can have nested HITL configuration
  quarantine:
    description: "Destination for invalid records from data quality checks"
    required_fields:
      - type
    optional_fields:
      - table
      - uri
      - path
      - conn_id
      - hitl  # Human-in-the-Loop approval workflow
    
    hitl:
      description: "HITL approval workflow for releasing quarantined records"
      fields:
        enabled:
          type: boolean
          default: false
          description: "Enable HITL approval before reprocessing quarantine"
        timeout_hours:
          type: number
          default: 24
          description: "Hours to wait for human approval"
        allowed_roles:
          type: array
          default: ["data-steward", "admin"]
          description: "Roles authorized to approve release"

destination_types:
  allowed_types:
    - snowflake_table
    - object_storage
    - local_file
    - print_logs
    - stored_procedure

  # Object Storage (S3, Azure Blob, GCS) unified interface
  object_storage:
    description: "Cloud object storage using ObjectStoragePath (supports S3, Azure, GCS)"
    required_one_of:
      - uri              # Option 1: Full URI like 'az://container@conn_id/path/file.parquet'
      - path_and_conn    # Option 2: Separate path and conn_id
    
    fields:
      uri:
        type: string
        description: "Full object storage URI: 's3://bucket@conn_id/path', 'az://container@conn_id/path', 'gs://bucket@conn_id/path'"
        pattern: "^(s3|az|gs|gcs)://[^@]+@[^/]+/.+$"
        examples:
          - "az://raw-data@azure_default/finnhub/filings.parquet"
          - "s3://company-lake@aws_default/bronze/sales.parquet"
          - "gs://analytics@gcp_default/events/clicks.parquet"
      
      path:
        type: string
        description: "Object storage path (used with conn_id)"
        examples:
          - "raw-data/finnhub/filings.parquet"
          - "bronze/sales/{{ ds }}/data.parquet"
      
      conn_id:
        type: string
        description: "Airflow connection ID for object storage"
        default: "Based on storage type (azure_default, aws_default, google_cloud_default)"
      
      file_format:
        type: string
        allowed_values: ["parquet", "csv", "json"]
        default: "parquet"
        description: "File format for storage"

# Optional sections - these are allowed but not required
optional_sections:
  - validation_rules
  - validation        # New Soda Core validation section
  - transformation
  - enrichment
  - schedule
  - partition
  - incremental

# =============================================================================
# DATA QUALITY VALIDATION (Soda Core)
# =============================================================================
# 
# The 'validation' section enables enterprise-grade data quality checks using
# Soda Core. Checks are run as a separate Airflow task between transformation
# and loading.
#
# Structure:
#   validation:
#     soda_checks:
#       checks:
#         - type: row_count
#           min: 1
#         - type: missing_count
#           column: customer_id
#           max: 0
#         - type: duplicate_count
#           column: order_id
#           max: 0
#         - type: invalid_percent
#           column: email
#           max_percent: 5
#           valid_regex: "^[\\w.-]+@[\\w.-]+\\.\\w+$"
#         - type: values_in_set
#           column: status
#           valid_values: ["PENDING", "APPROVED", "REJECTED"]
#         - type: range
#           column: amount
#           min: 0
#           max: 1000000
#         - type: freshness
#           column: updated_at
#           max_hours: 24
#     quality_gates:
#       fail_threshold: 0.95        # Fail if <95% checks pass
#       warn_threshold: 0.98        # Warn if <98% checks pass
#       quarantine_invalid: true    # Route invalid records to quarantine
#
validation:
  optional_fields:
    - soda_checks
    - quality_gates
  
  soda_checks:
    description: "Soda Core data quality checks configuration"
    fields:
      checks:
        type: array
        description: "List of data quality checks to run"
        items:
          type:
            allowed_values:
              - row_count         # Ensure minimum row count
              - missing_count     # Check for null/missing values
              - duplicate_count   # Check for duplicates
              - invalid_percent   # Percentage of invalid values
              - values_in_set     # Allowed values validation
              - range             # Numeric range validation
              - freshness         # Data freshness check
            required: true
          column:
            type: string
            description: "Column to check (required for most check types)"
          min:
            type: number
            description: "Minimum value (for row_count, range)"
          max:
            type: number
            description: "Maximum value (for missing_count, duplicate_count, range)"
          max_percent:
            type: number
            description: "Maximum percentage (for invalid_percent)"
          valid_regex:
            type: string
            description: "Regex pattern for valid values (for invalid_percent)"
          valid_values:
            type: array
            description: "List of allowed values (for values_in_set)"
          max_hours:
            type: number
            description: "Maximum age in hours (for freshness)"
  
  quality_gates:
    description: "Thresholds for pass/fail/warn decisions"
    fields:
      fail_threshold:
        type: number
        default: 0.0
        description: "Fail pipeline if pass rate is below this (0.0 to 1.0)"
      warn_threshold:
        type: number
        default: 0.95
        description: "Warn if pass rate is below this (0.0 to 1.0)"
      quarantine_invalid:
        type: boolean
        default: false
        description: "Route invalid records to quarantine destination"

# Quarantine destination configuration
quarantine_destination:
  description: "Configuration for quarantine table where invalid records are stored"
  default_table: "DQ_AUDIT.QUARANTINE_RECORDS"
  schema:
    quarantine_id: "STRING - UUID for the quarantine record"
    source_pipeline: "STRING - Name of the DAG/pipeline"
    source_table: "STRING - Original destination table"
    failed_checks: "ARRAY<STRING> - List of failed check names"
    record_data: "VARIANT/JSON - Original record as JSON"
    quarantined_at: "TIMESTAMP - When the record was quarantined"
    reprocessed: "BOOLEAN - Whether record has been reprocessed"
    reprocessed_at: "TIMESTAMP - When record was reprocessed"

# Default values for missing fields
defaults:
  schedule:
    interval: "@daily"
    start_date: "2024-01-01"
    catchup: false
    tags: ["auto-generated"]
    # Deadline alert defaults (Airflow 3.1.6)
    deadline:
      enabled: false
      timeout_minutes: 30
      email_enabled: false
      email_recipients: []
      kafka_topic: "pipeline-alerts"
  
  destination:
    primary:
      type: "print_logs"
      max_rows: 10
  
  authentication:
    type: "none"
  
  validation:
    quality_gates:
      fail_threshold: 0.0
      warn_threshold: 0.95
      quarantine_invalid: false

# =============================================================================
# SCHEDULE CONFIGURATION WITH DEADLINE ALERTS (Airflow 3.1.6)
# =============================================================================
#
# The 'deadline' section enables deadline alerts that notify when a DAG run
# is taking longer than expected. Kafka alerts are ALWAYS sent; email is optional.
#
# Structure:
#   schedule:
#     interval: "@hourly"
#     deadline:
#       enabled: true
#       timeout_minutes: 45          # Alert if run exceeds this duration
#       email_enabled: true          # Optional email notifications
#       email_recipients:            # List of email addresses
#         - "data-alerts@company.com"
#       kafka_topic: "pipeline-alerts"  # Kafka topic for alerts
#
schedule:
  optional_fields:
    - interval
    - start_date
    - end_date
    - timezone
    - catchup
    - tags
    - deadline
    - retry
    - max_active_runs
    
  retry:
    description: "Airflow 3 exception-based retry policy"
    fields:
      policy:
        type: string
        allowed_values: ["transient"]
        description: "Retry policy to apply (e.g. transient for ConnectionErrors)"
      exponential_backoff:
        type: boolean
        default: false
        description: "Whether to use exponential backoff for retries"
      retry_delay_seconds:
        type: number
        default: 300
        description: "Initial delay between retries"
      max_retries:
        type: number
        default: 3
        description: "Maximum number of retries"
  
  max_active_runs:
    type: integer
    description: "Maximum number of active DAG runs allowed"
  
  timezone:
    type: string
    default: "UTC"  # Falls back to global_settings.default_timezone if not specified
    description: |
      IANA timezone name for schedule execution (e.g., "UTC", "America/New_York", "Europe/London", "Asia/Tokyo").
      
      IMPORTANT: Cron schedules adjust for Daylight Saving Time (DST) transitions, while timedelta schedules do not.
      
      - Cron example: "@daily" at midnight in "America/New_York" runs at 4am UTC (EST) or 5am UTC (EDT)
      - Timedelta example: timedelta(days=1) always runs 24 hours apart regardless of DST
      
      Recommendation: Use "UTC" for production pipelines to avoid DST complexity and ensure predictable execution times.
      
      Non-UTC timezones will log INFO-level warnings to track DST exposure.
    examples:
      - "UTC"
      - "America/New_York"
      - "America/Chicago"
      - "Europe/London"
      - "Europe/Amsterdam"
      - "Asia/Tokyo"
      - "Australia/Sydney"
  
  end_date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"  # YYYY-MM-DD format
    description: |
      Optional end date for DAG scheduling. DAG will not be scheduled after this date.
      Format: YYYY-MM-DD (e.g., "2025-12-31")
      Uses the same timezone as specified in the 'timezone' field.
  
  deadline:
    description: "Deadline alert configuration (Airflow 3.1.6 feature)"
    fields:
      enabled:
        type: boolean
        default: false
        description: "Enable deadline alerts for this pipeline"
      tiers:
        type: array
        description: "Array of multi-tier deadline alerts"
      timeout_minutes:
        type: number
        default: 30
        description: "Alert if DAG run exceeds this duration (minutes)"
      reference:
        type: string
        allowed_values: ["queued_at", "average_runtime"]
        default: "queued_at"
        description: "Base reference time for the deadline"
      email_enabled:
        type: boolean
        default: false
        description: "Enable email notifications (Kafka always on)"
      email_recipients:
        type: array
        description: "List of email addresses for alerts"
      kafka_topic:
        type: string
        default: "pipeline-alerts"
        description: "Kafka topic for deadline alert events"

# =============================================================================
# QUARANTINE CONFIGURATION WITH HITL APPROVAL (Airflow 3.1.6)
# =============================================================================
#
# The 'quarantine.hitl' section enables Human-in-the-Loop approval workflows
# for quarantine record release. Data stewards can approve/reject through UI.
#
# Structure:
#   destination:
#     quarantine:
#       type: snowflake_table
#       table: DQ_AUDIT.QUARANTINE_RECORDS
#       hitl:
#         enabled: true
#         timeout_hours: 24
#
quarantine_hitl:
  description: "HITL approval configuration for quarantine release"
  fields:
    enabled:
      type: boolean
      default: false
      description: "Enable HITL approval workflow for quarantine release"
    timeout_hours:
      type: number
      default: 24
      description: "Hours to wait for approval before auto-action"
    allowed_roles:
      type: array
      default: ["data-steward", "admin"]
      description: "Roles authorized to approve quarantine release"

# Validation rules for specific field types
field_validation:
  name:
    type: string
    max_length: 50
    pattern: "^[a-zA-Z0-9_]+$"  # alphanumeric and underscore only
  
  interval:
    type: string
    allowed_values:
      - "@once"
      - "@hourly" 
      - "@daily"
      - "@weekly"
      - "@monthly"
      - "@yearly"
    # Also allows cron expressions
  
  start_date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"  # YYYY-MM-DD format
  
  end_date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"  # YYYY-MM-DD format
  
  timezone:
    type: string
    description: "IANA timezone name - validates against known timezones"
    # Common examples: UTC, America/New_York, Europe/London, Asia/Tokyo
  
  catchup:
    type: boolean
  
  max_rows:
    type: integer
    min_value: 1
    max_value: 1000

# =============================================================================
# ASSET PARTITIONING CONFIGURATION (Airflow 3.3.0)
# =============================================================================
partition:
  optional_fields:
    - enabled
    - dimension
    - column
    - granularity
    - mapper
    - wait_policy
    - minimum_count
    - runtime_assigned
    - max_fan_out

  enabled:
    type: boolean
    default: false
  dimension:
    type: string
    default: "date"
  column:
    type: string
  granularity:
    type: string
    default: "day"
  mapper:
    type: string
    default: "fan_out"
  wait_policy:
    type: string
    default: "wait_for_all"
  minimum_count:
    type: integer
    default: 1
  runtime_assigned:
    type: boolean
    default: false
  max_fan_out:
    type: integer
    default: 64

# =============================================================================
# TASK STATE STORE INCREMENTAL CONFIGURATION (Airflow 3.3.0)
# =============================================================================
incremental:
  optional_fields:
    - enabled
    - watermark_column
    - initial_watermark
    - lookback

  enabled:
    type: boolean
    default: false
  watermark_column:
    type: string
  initial_watermark:
    type: string
  lookback:
    type: integer
    default: 0