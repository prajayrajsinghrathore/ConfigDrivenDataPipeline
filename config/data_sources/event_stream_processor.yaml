metadata:
  tenant: sandbox
  description: "Phase 2 Validation"
data_source:
  name: event_stream_processor
  type: rest_api
  endpoint: https://official-joke-api.appspot.com/random_joke
schedule:
  interval: null
partition:
  enabled: true
  runtime_assigned: true
  granularity: day
  mapper: fan_out
incremental:
  enabled: true
  strict: true
data_quality:
  enabled: true
  scorecard: true
destination:
  primary:
    type: print_logs
