# Joke API test for local development
name: joke_api_test
description: Test data source for validating TaskFlow API integration
source_type: http

metadata:
  tenant: testing
  owner: data-engineering
  tags:
    - test
    - http-api

schedule:
  interval: "0 10 * * *"
  start_date: "2024-01-01"
  catchup: false

retries: 2

data_source:
  name: joke_api_test
  type: rest_api
  connection_id: http_default
  endpoint: https://official-joke-api.appspot.com/random_joke
  method: GET
  response_format: json

destination:
  type: local_file
  path: /tmp/airflow_output/joke_api_test.json

transformations:
  - type: add_column
    column_name: processed_at
    formula: "NOW()"
  - type: add_column
    column_name: joke_type
    formula: "type"

data_quality_checks:
  enabled: true
  rules:
    - name: setup_not_null
      column: setup
      type: not_null
    - name: punchline_not_null
      column: punchline
      type: not_null
