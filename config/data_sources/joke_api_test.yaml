# Joke API test for local development (smoke pipeline for e2e runs)
# 2026-07-23: migrated off the legacy top-level layout — the old top-level
# name/source_type/retries/transformations/data_quality_checks keys were never
# read by the factory (dead config). Add a `validation:` block if DQ is wanted.
metadata:
  tenant: testing
  owner: data-engineering
  description: Test data source for validating TaskFlow API integration
  tags:
    - test
    - http-api

schedule:
  interval: "0 10 * * *"
  start_date: "2024-01-01"
  catchup: false
  retry:
    max_retries: 2

data_source:
  name: joke_api_test
  type: rest_api
  connection_id: http_default
  endpoint: https://official-joke-api.appspot.com/random_joke
  method: GET
  response_format: json

destination:
  type: local_file
  path: /tmp/airflow_output/joke_api_test.json
