metadata:
  tenant: testing
  description: "Reference configuration for a partitioned pipeline"

data_source:
  name: reference_partitioned_src
  type: rest_api
  endpoint: https://api.example.com/data
  response_format: json

schedule:
  interval: null

partition:
  enabled: true
  runtime_assigned: true
  granularity: day
  mapper: fan_out

destination:
  primary:
    type: print_logs
