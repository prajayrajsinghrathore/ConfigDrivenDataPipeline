# Simple test data source for local development
# name/source_type/retries/data_quality_checks keys were never read by the
# factory (dead config). Add a `validation:` block if DQ is wanted.
metadata:
  tenant: testing
  owner: data-engineering
  description: Simple test API for local DAG generation testing
  tags:
    - test

schedule:
  interval: "0 9 * * *"
  start_date: "2024-01-01"
  catchup: false
  retry:
    max_retries: 1

data_source:
  name: simple_test
  type: rest_api
  connection_id: http_default
  endpoint: https://api.chucknorris.io/jokes/random
  method: GET
  response_format: json

destination:
  type: local_file
  path: /tmp/airflow_output/simple_test.json
