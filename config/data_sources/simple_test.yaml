# Simple test data source for local development
name: simple_test
description: Simple test API for local DAG generation testing
source_type: http

metadata:
  tenant: testing
  owner: data-engineering
  tags:
    - test

schedule:
  interval: "0 9 * * *"
  start_date: "2024-01-01"
  catchup: false

retries: 1

data_source:
  name: simple_test
  type: rest_api
  connection_id: http_default
  endpoint: https://api.chucknorris.io/jokes/random
  method: GET
  response_format: json

destination:
  type: local_file
  path: /tmp/airflow_output/simple_test.json

data_quality_checks:
  enabled: true
  rules:
    - name: not_null
      column: value
      type: not_null
