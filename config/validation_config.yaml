# Data quality validation config for local development
validation_rules:
  not_null:
    type: not_null
    severity: error
  
  unique:
    type: unique
    severity: error
  
  range:
    type: range
    severity: warning
  
  regex:
    type: regex
    severity: warning

quarantine:
  enabled: true
  storage_type: local_file
  path: /tmp/airflow_output/quarantine/
  
human_in_the_loop:
  enabled: false  # Disable HITL for local testing
  approval_pool: hitl_approvers
