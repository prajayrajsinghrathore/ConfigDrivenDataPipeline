# ==============================================================================
# RBAC
# ==============================================================================
rbac:
  create: true
  createSCCRoleBinding: false  # Not needed for AKS

# ==============================================================================
# SERVICE ACCOUNT
# ==============================================================================
serviceAccount:
  create: true
  name: airflow
  annotations:
    # Azure managed identity for accessing ACR
    azure.workload.identity/client-id: "<workload-identity-client-id>"

# ==============================================================================
# MONITORING & OBSERVABILITY
# ==============================================================================
# Metrics exported via statsd exporter for Grafana
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
