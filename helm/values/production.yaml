# Airflow Helm Chart Values for AKS Deployment with DAG Bundles
# Official Airflow Helm Chart: https://airflow.apache.org/docs/helm-chart/stable/index.html

# ==============================================================================
# AIRFLOW IMAGE CONFIGURATION
# ==============================================================================
images:
  airflow:
    repository: rlmsbxdpluksacr.azurecr.io/airflow
    # 3.3.0 engine image (framework + deadline notifiers baked in). Build/push
    # via the engine CI (.azure-pipelines/ci.yml). Prefer pinning by DIGEST in
    # production once the ACR 3.3.0 image exists (mirrors the Dockerfile base pin).
    tag: "3.3.0-custom"
    pullPolicy: IfNotPresent

# CONFIRMED via `helm template` against chart 1.22.0 (2026-07-30): the
# KubernetesExecutor pod_template_file does NOT source its image from
# `images.airflow.*` above — that field only feeds the standing
# Deployments/StatefulSets (scheduler, apiServer, dagProcessor, etc). The
# generated per-task pod template reads `defaultAirflowRepository`/
# `defaultAirflowTag` instead, which default to the chart's own
# `apache/airflow:3.2.2` if left unset. Without this, every task pod
# KubernetesExecutor spawns would silently run the stock image — no
# framework code, no deadline notifiers — while every other pod correctly
# ran the custom image. Must be kept in sync with `images.airflow` above.
defaultAirflowRepository: rlmsbxdpluksacr.azurecr.io/airflow
defaultAirflowTag: "3.3.0-custom"

# ==============================================================================
# EXECUTOR CONFIGURATION
# ==============================================================================
# KubernetesExecutor: every task instance runs as its own ephemeral pod,
# scheduled directly via the K8s API — no Celery workers, no broker. This is
# why the dataframe-storage shared volume (PERSISTENT VOLUMES below) is
# mandatory rather than a scale-out edge case: two tasks in the SAME DAG run
# never share a filesystem by default under this executor, guaranteed, every
# time, not just when the scheduler happens to pick a different node.
#
# Local dev (docker-compose) intentionally stays on CeleryExecutor — this
# swap is production/AKS-only; see docker/docker-compose.yaml, unchanged.
executor: "KubernetesExecutor"

# CONFIRMED via `helm template` against chart 1.22.0 (2026-07-30): the
# chart's bundled Redis defaults to `enabled: true` UNCONDITIONALLY — it is
# NOT tied to the executor choice, and still rendered a full
# redis-statefulset/-service/-serviceaccount even with executor set to
# KubernetesExecutor above. Redis was only ever needed as CeleryExecutor's
# broker, so it must be disabled explicitly here; nothing does it for you.
redis:
  enabled: false

# ==============================================================================
# DAG BUNDLE CONFIGURATION  (Task 3C.4 — engine/content split)
# ==============================================================================
# Two-bundle model that realizes the engine-vs-content separation:
#   - "framework"  = the ENGINE. generate_dags.py + rlam_airflow_framework (incl.
#     the deadline notifiers, folded into the package 2026-07-23) ship BAKED into
#     the image at /opt/airflow/dags — a LocalDagBundle, versioned by image tag.
#   - "production_configs" = the CONTENT. Pipeline YAMLs come from the SEPARATE
#     config repo via GitDagBundle — NEVER baked into the image, so a bad config
#     rolls back by moving a git tag with no image rebuild.
# This is why no `config/data_sources/*.yaml` is copied into the Dockerfile.

config:
  # DAG processor configuration for bundle support
  dag_processor:
    # Path where DAG bundles will be stored/cached
    dag_bundle_storage_path: "/opt/airflow/bundle_storage"

    # List of DAG bundles to load
    #
    # BUG FOUND via `helm template` (2026-07-30): this value gets embedded
    # by the chart into airflow.cfg, which itself is wrapped in ANOTHER YAML
    # block scalar inside the ConfigMap template. Multi-line, unindented JSON
    # here breaks that nested block scalar's indentation rules — YAML parse
    # error: "could not find expected ':'" at the ConfigMap. Collapsed to a
    # single line below (JSON/INI don't care about line length; only the
    # nested-YAML embedding did). Pretty-printed for reference only:
    #   [
    #     {
    #       "name": "framework",
    #       "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
    #       "kwargs": {
    #         "path": "/opt/airflow/dags",
    #         "refresh_interval": 300
    #       }
    #     },
    #     {
    #       "name": "production_configs",
    #       "classpath": "airflow.providers.git.bundles.git.GitDagBundle",
    #       "kwargs": {
    #         "tracking_ref": "refs/tags/prod-v1.0.0",
    #         "git_conn_id": "github_configs",
    #         "subdir": "config",
    #         "refresh_interval": 300,
    #         "view_url_template": "https://github.com/prajayrajsinghrathore/AirrflowConfigBundle/tree/prod-v1.0.0/config/{subdir}"
    #       }
    #     }
    #   ]
    # IMPORTANT: Whitespace on last line matters for configparser
    dag_bundle_config_list: |
      [{"name": "framework", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/dags", "refresh_interval": 300}}, {"name": "production_configs", "classpath": "airflow.providers.git.bundles.git.GitDagBundle", "kwargs": {"tracking_ref": "refs/tags/prod-v1.0.0", "git_conn_id": "github_configs", "subdir": "config", "refresh_interval": 300, "view_url_template": "https://github.com/prajayrajsinghrathore/AirrflowConfigBundle/tree/prod-v1.0.0/config/{subdir}"}}]
    # ROLLBACK (ROLLBACK_STRATEGY.md): production pins a TAG, not a branch. The
    # config repo's CI (.azure-pipelines/config.yml, which belongs in that repo)
    # tags prod-vX.Y.Z after the schema/unknown-key contract passes; roll back by
    # pointing tracking_ref at the previous tag and `helm upgrade`. Bump the
    # env[AIRFLOW_DAG_BUNDLE_VERSION] value below to match the tag.
  

# ==============================================================================
# ENVIRONMENT VARIABLES
# ==============================================================================
env:
  # Bundle versioning for observability
  - name: AIRFLOW_DAG_BUNDLE_NAME
    value: "production_configs"
  - name: AIRFLOW_DAG_BUNDLE_VERSION
    value: "prod-v1.0.0"  # MUST match tracking_ref tag above (rollback: bump both together)
  
  # Multi-tenancy config path
  - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH
    value: "/opt/airflow/bundle_storage"
  
  # Git environment variables (required by GitPython)
  - name: GIT_PYTHON_GIT_EXECUTABLE
    value: "/usr/bin/git"
  - name: GIT_PYTHON_REFRESH
    value: "quiet"
  
  # Kafka configuration
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka.default.svc.cluster.local:9092"
  - name: KAFKA_TOPIC_MARKET_DATA
    value: "Market_Data"

# BUG FOUND via `helm template` (2026-07-30): the chart-wide `env:` list
# above only accepts {name, value} (values.schema.json restricts it to
# that shape, no `valueFrom`) — a secretKeyRef-based entry here fails
# validation outright. Secret-backed env vars need a per-component `env:`
# list instead (those DO support valueFrom), placed on whichever component
# actually needs them rather than broadcast to every pod:
#   - AZURE_DEVOPS_PAT: only the DAG-bundle refresh needs Git auth ->
#     dagProcessor.env (DAG PROCESSOR CONFIGURATION below).
#   - SNOWFLAKE_CONN_ID / AZURE_DATA_LAKE_CONN_ID: read via os.getenv() in
#     rlam_airflow_framework/tenant_context.py, which only ever runs as
#     part of executing pipeline task code -> workers.kubernetes.env
#     (WORKER CONFIGURATION below), not scheduler/apiServer/dagProcessor.

# ==============================================================================
# AIRFLOW CONNECTIONS
# ==============================================================================
# Git connection for GitDagBundle authentication
# GitHub public repo - no authentication needed, but can use PAT for private repos
connections:
  - conn_id: github_configs
    conn_type: git
    host: https://github.com/prajayrajsinghrathore/AirrflowConfigBundle.git
    login: ""  # Empty for public repos
    password: ""  # Use ${GITHUB_PAT} if repo is private
    extra: |
      {
        "git_executable": "/usr/bin/git"
      }

  # Deadline-alert Kafka connection — mirrors the compose `airflow connections
  # add kafka_default` seed (Phase 1.3). The SyncCallback deadline notifier reads
  # THIS DB-stored connection (3.3.0 #65269). In-cluster Kafka service host.
  - conn_id: kafka_default
    conn_type: kafka
    extra: |
      {
        "bootstrap.servers": "kafka.default.svc.cluster.local:9092",
        "security.protocol": "PLAINTEXT"
      }

  # SMTP connection for the optional email deadline notifier. Point host/login
  # at the real relay; keep the default validating STARTTLS context for a
  # CA-signed server (set ssl_context=none only for a self-signed relay).
  - conn_id: smtp_default
    conn_type: smtp
    host: smtp.internal.rlam.example    # TODO: real SMTP relay
    port: 587
    login: ""                            # TODO: from a K8s secret if authenticated
    password: ""

# ==============================================================================
# SECRETS CONFIGURATION
# ==============================================================================
# Create K8s secret with all three keys the env vars above/below reference
# (ENVIRONMENT VARIABLES, DAG PROCESSOR, WORKER CONFIGURATION sections):
# kubectl create secret generic airflow-secrets \
#   --from-literal=AZURE_DEVOPS_PAT=<your-pat-token> \
#   --from-literal=snowflake-conn-id=<your-snowflake-conn-value> \
#   --from-literal=azure-data-lake-conn-id=<your-azure-data-lake-conn-value>
#
# BUG FOUND via `helm template` (2026-07-30), two issues:
#  1. `extraSecrets.<name>.data` must be a STRING (templated, base64 values),
#     per values.schema.json — the nested-map form below failed validation.
#  2. Only AZURE_DEVOPS_PAT was ever defined here, but the env vars that
#     reference this secret's `snowflake-conn-id`/`azure-data-lake-conn-id`
#     keys (DAG PROCESSOR / WORKER CONFIGURATION sections) had nothing to
#     read — a real deploy would have failed pod startup with
#     CreateContainerConfigError: key not found in Secret.
extraSecrets:
  airflow-secrets:
    data: |
      AZURE_DEVOPS_PAT: <base64-encoded-pat>
      snowflake-conn-id: <base64-encoded-snowflake-conn>
      azure-data-lake-conn-id: <base64-encoded-azure-data-lake-conn>

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
# Bundle storage needs persistent volume for caching Git checkouts
# KNOWN GAP: managed-premium (Azure Disk CSI) is ReadWriteOnce only and does
# NOT actually support ReadWriteMany below, despite this claiming it — see the
# KNOWN GAP note further down (near dataframe-storage) for why that matters
# and what fixed it there. Not fixed here; this PVC is a separate concern
# (git DAG bundle cache) out of scope for the dataframe-storage change.
persistence:
  enabled: true
  existingClaim: airflow-bundle-storage-pvc  # Pre-created PVC
  storageClassName: managed-premium  # Azure managed premium SSD
  size: 20Gi
  accessMode: ReadWriteMany  # For multi-pod access

# airflow-dataframe-storage-pvc backs the dataframe-storage volume mounted
# below (extraVolumes/extraVolumeMounts) at /opt/airflow/tmp/dataframes —
# the local-parquet inter-task hand-off path TaskFlow tasks use
# (rlam_airflow_framework/taskflow/storage.py).
#
# NOTE: `managed-premium` (Azure Disk CSI) is ReadWriteOnce ONLY — it does
# NOT support ReadWriteMany despite what an earlier version of this file
# claimed. Azure Disk is bound to a single node; a second pod scheduling
# onto a different node cannot attach it. This PVC instead uses the Blob
# CSI driver in blobfuse2 (fuse) mount mode, authenticated via Workload
# Identity (no storage account key/SAS anywhere) — see the StorageClass
# below. Every pod that mounts this volume gets the SAME blob container
# regardless of node, and DataFrameStorage needs zero code changes since
# it still just sees a local-looking path.
#
# 1. Pre-create the StorageClass (cluster-scoped, one-time):
#   kubectl create -f - <<EOF
#   apiVersion: storage.k8s.io/v1
#   kind: StorageClass
#   metadata:
#     name: azureblob-fuse-premium-wi
#   provisioner: blob.csi.azure.com
#   parameters:
#     protocol: fuse2
#     resourceGroup: <storage-account-resource-group>
#     storageAccount: <storage-account-name>
#     containerName: airflow-dataframe-scratch
#     # TODO(verify): exact key/value for Workload Identity auth against the
#     # Blob CSI driver version installed on this cluster — recent driver
#     # releases use `azurestorageauthtype: workloadidentity` +
#     # `azurestorageidentityclientid: <uami-client-id>`; older releases may
#     # differ. Confirm against the installed CSI driver's docs before
#     # applying. This driver-level identity must be granted "Storage Blob
#     # Data Contributor" on the target storage account/container — a plain
#     # Azure RBAC role assignment, no networking change required even
#     # though the storage account lives in a different subscription than AKS.
#     azurestorageauthtype: workloadidentity
#     azurestorageidentityclientid: "<workload-identity-client-id>"  # same UAMI as serviceAccount below
#   reclaimPolicy: Retain
#   volumeBindingMode: Immediate
#   EOF
#
# 2. Pre-create the PVC against that StorageClass:
#   kubectl create -f - <<EOF
#   apiVersion: v1
#   kind: PersistentVolumeClaim
#   metadata:
#     name: airflow-dataframe-storage-pvc
#   spec:
#     accessModes: ["ReadWriteMany"]
#     storageClassName: azureblob-fuse-premium-wi
#     resources:
#       requests:
#         storage: 50Gi  # Nominal — blob storage doesn't hard-cap like a disk, but the field is required
#   EOF
#
# KNOWN GAP (not fixed here — flagging, not silently changing): the
# bundle-storage PVC (persistence: block above) has the SAME
# managed-premium/ReadWriteMany mismatch. It's a separate concern (git DAG
# bundle cache, not dataframe hand-off) and wasn't in scope for this
# change, but it has the identical bug and should get the same
# Blob-CSI-or-equivalent treatment separately.

# Additional volume for bundle storage
#
# dataframe-storage is REQUIRED under KubernetesExecutor (EXECUTOR
# CONFIGURATION above): TaskFlow tasks hand DataFrames between each other as
# parquet files under rlam_airflow_framework/taskflow/storage.py's
# AIRFLOW_HOME/tmp/dataframes (only the file path travels through XCom, not
# the DataFrame itself). Every task instance gets a fresh pod with an empty
# filesystem here — this shared volume isn't an edge-case mitigation, it's
# mandatory for the pipeline to function at all, on every single task
# boundary, not just when two tasks happen to land on different pods.
#
# CONFIRMED via `helm template` (2026-07-30): dataframe-storage does NOT
# belong in the chart-wide extraVolumes/extraVolumeMounts below. Those only
# reach the scheduler/apiServer/dagProcessor Deployments — the
# KubernetesExecutor pod_template_file (what actually runs ingest_data/
# transform_data/etc, the only things that touch DataFrameStorage) is a
# SEPARATE render path fed by `workers.kubernetes.extraVolumes`/
# `extraVolumeMounts` instead. Rendering with only the chart-wide volumes
# set produced a task pod template with just `logs`+`config` — no
# dataframe-storage at all — which would have silently reproduced the
# exact FileNotFoundError this whole change exists to fix. Scoped correctly
# under WORKER CONFIGURATION below (workers.kubernetes.*), not here.
extraVolumes:
  - name: bundle-storage
    persistentVolumeClaim:
      claimName: airflow-bundle-storage-pvc

extraVolumeMounts:
  - name: bundle-storage
    mountPath: /opt/airflow/bundle_storage

# ==============================================================================
# SCHEDULER CONFIGURATION
# ==============================================================================
scheduler:
  replicas: 2  # HA scheduler for production
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # DAG parsing configuration
  # BUG FOUND via `helm template` (2026-07-30): `scheduler.extraEnv` isn't a
  # real key in this chart's schema ("additional properties 'extraEnv' not
  # allowed") — the correct per-component key is `env` (schema-verified
  # above to support both plain values and valueFrom).
  env:
    - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
      value: "60"  # Scan for DAG files every 60s
    - name: AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL
      value: "30"  # Min time between re-parsing a DAG

  # Provision Airflow pools FROM global_settings.yaml's tenants.*.slots (3A.6
  # contract, see TENANT-SPECIFIC RESOURCE POOLS below for why this lives
  # here rather than migrateDatabaseJob, and why it re-clones the config repo
  # rather than reading the DAG bundle's checkout).
  extraInitContainers:
    - name: provision-tenant-pools
      image: "{{ .Values.images.airflow.repository }}:{{ .Values.images.airflow.tag }}"
      # TODO(verify): `airflow pools set` needs AIRFLOW__DATABASE__SQL_ALCHEMY_CONN.
      # The chart injects it into the scheduler's main container automatically,
      # but extraInitContainers may not inherit it — confirm with
      # `helm template ... | grep -A5 provision-tenant-pools` and add an
      # explicit envFrom/secretRef (release's `{release-name}-airflow-metadata`
      # secret, chart-dependent) here if it's missing.
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          rm -rf /tmp/config_checkout
          git clone --depth 1 --branch prod-v1.0.0 \
            https://github.com/prajayrajsinghrathore/AirrflowConfigBundle.git \
            /tmp/config_checkout
          python - <<'PY'
          import subprocess
          import yaml

          with open("/tmp/config_checkout/config/global_settings.yaml") as f:
              g = yaml.safe_load(f)

          seen = {}
          for tenant, cfg in g.get("tenants", {}).items():
              pool = cfg["pool"]
              seen[pool] = max(seen.get(pool, 0), int(cfg["slots"]))

          for pool, slots in seen.items():
              subprocess.run(
                  ["airflow", "pools", "set", pool, str(slots),
                   f"Tenant pool provisioned from global_settings.yaml (3A.6 contract)"],
                  check=True,
              )
          PY

# ==============================================================================
# DAG PROCESSOR CONFIGURATION
# ==============================================================================
# GitDagBundle refresh (production_configs bundle, DAG BUNDLE CONFIGURATION
# above) runs in the dag-processor component in Airflow 3 — this is where
# AZURE_DEVOPS_PAT actually needs to land for the `github_configs` git
# Connection to authenticate against a private repo, not the chart-wide
# `env:` (ENVIRONMENT VARIABLES above), which doesn't support secretKeyRef.
dagProcessor:
  env:
    - name: AZURE_DEVOPS_PAT
      valueFrom:
        secretKeyRef:
          name: airflow-secrets
          key: AZURE_DEVOPS_PAT

# ==============================================================================
# API SERVER CONFIGURATION (Airflow 3 — was `webserver` in 2.x / 3.1.x charts)
# ==============================================================================
# Airflow 3 replaced the webserver with the FastAPI API server; the official
# Helm chart renamed the `webserver:` block to `apiServer:`.
# TODO(verify): confirm the key name AND sub-keys (service/resources/replicas)
# against the chosen chart's values.schema.json — the chart may also have moved
# to `apiServer.service`/`apiServer.replicas` with different defaults. Do not
# assume this block is complete; validate with `helm template ... --dry-run`.
apiServer:
  replicas: 2
  service:
    type: ClusterIP  # ISTIO gateway will handle external access
    annotations:
      # ISTIO sidecar injection
      sidecar.istio.io/inject: "true"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# ==============================================================================
# WORKER CONFIGURATION (KubernetesExecutor: per-task pod template, not a
# standing worker deployment — `replicas`/`celery.*` from the old
# CeleryExecutor config are gone; there's no persistent worker fleet to size)
# ==============================================================================
# TODO(verify): confirm against this chart version's values.schema.json that
# `workers.resources` still feeds the generated per-task pod template under
# KubernetesExecutor (it does in most recent chart releases, since the
# template is rendered from this same `workers:` block), and that the
# chart-level `extraVolumes`/`extraVolumeMounts` + `serviceAccount` (PERSISTENT
# VOLUMES / SERVICE ACCOUNT above) are included in that generated template —
# i.e. every spawned task pod gets dataframe-storage mounted AND the Workload
# Identity service account, not just the scheduler/apiServer pods. Validate
# with `helm template ... | grep -A30 "pod-template-file"` before relying on
# either. If the chart does NOT propagate these automatically, they need to
# be set explicitly via `workers.podTemplate`/`config.kubernetes_executor`
# (pod_template_file override) instead.
workers:
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # KubernetesExecutor renders its per-task pod_template_file from
  # `workers.kubernetes.*`, NOT from the chart-wide extraVolumes/
  # extraVolumeMounts/serviceAccount (PERSISTENT VOLUMES / SERVICE ACCOUNT
  # sections above) — confirmed via `helm template`: with only the
  # chart-wide ones set, the rendered task pod template had no
  # dataframe-storage volume and ran under a separate, auto-created
  # "airflow-worker" ServiceAccount that never saw our Workload Identity
  # annotation. Both must be set here explicitly, scoped to the executor
  # that actually runs ingest_data/transform_data/etc.
  kubernetes:
    extraVolumes:
      - name: dataframe-storage
        persistentVolumeClaim:
          claimName: airflow-dataframe-storage-pvc  # Pre-created PVC, Blob CSI + Workload Identity (see PERSISTENT VOLUMES above)
    extraVolumeMounts:
      - name: dataframe-storage
        mountPath: /opt/airflow/tmp/dataframes
    # SA annotation alone isn't sufficient for AKS Workload Identity — the
    # pod itself needs this label or the mutating webhook won't inject the
    # federated token (SERVICE ACCOUNT section above has the general note).
    labels:
      azure.workload.identity/use: "true"
    serviceAccount:
      # CONFIRMED via `helm template`: annotations alone rendered NOTHING —
      # the chart only emits templates/workers/worker-kubernetes-
      # serviceaccount.yaml (the object that actually carries these
      # annotations) when `create` is explicitly set. Without it, the pod
      # silently falls back to the plain worker-serviceaccount.yaml, which
      # has no annotations at all — the Blob CSI mount would then fail to
      # authenticate with no obvious error pointing at this being why.
      create: true
      annotations:
        # Same UAMI as the top-level `serviceAccount.annotations` (SERVICE
        # ACCOUNT above) — task pods use their OWN SA ("airflow-worker"),
        # which does NOT fall back to the release-wide
        # `serviceAccount.annotations`, so the Workload Identity annotation
        # has to be repeated here or the Blob CSI mount can't authenticate
        # for any task pod.
        azure.workload.identity/client-id: "<workload-identity-client-id>"
    # SNOWFLAKE_CONN_ID / AZURE_DATA_LAKE_CONN_ID: read via os.getenv() in
    # rlam_airflow_framework/tenant_context.py, which only runs as part of
    # executing pipeline task code — belongs on the task pods specifically,
    # not the chart-wide `env:` (which doesn't support secretKeyRef anyway;
    # see ENVIRONMENT VARIABLES above).
    env:
      - name: SNOWFLAKE_CONN_ID
        valueFrom:
          secretKeyRef:
            name: airflow-secrets
            key: snowflake-conn-id
      - name: AZURE_DATA_LAKE_CONN_ID
        valueFrom:
          secretKeyRef:
            name: airflow-secrets
            key: azure-data-lake-conn-id

# CONFIRMED via `helm template` against chart 1.22.0 (2026-07-30): the
# chart's bundled Redis defaults to `enabled: true` unconditionally — see
# the `redis: {enabled: false}` override under EXECUTOR CONFIGURATION
# above, which is the actual fix. (An earlier version of this comment
# assumed the chart auto-disabled Redis based on executor choice; it does
# not — that assumption was wrong and has been corrected.)

# ==============================================================================
# TENANT-SPECIFIC RESOURCE POOLS
# ==============================================================================
# 3A.6 CONTRACT: Airflow pool slot counts MUST match the `tenants.*.slots` values
# in the global_settings.yaml the DAG factory reads at parse time — the derived
# max_active_runs logic depends on the config value equalling the real pool size.
# So provision pools FROM that same file, do not hand-maintain a list here.
#
# global_settings.yaml ships as part of the `production_configs` GitDagBundle
# (config/ subdir, see DAG BUNDLE CONFIGURATION above) — it is NOT baked into
# the image, so it isn't at a fixed on-disk path an initContainer can just
# read. Rather than depending on the bundle-storage PVC already being
# populated (chicken-and-egg on a fresh cluster), the init step below does
# its own shallow clone of the same repo/tag the GitDagBundle tracks.
#
# This runs as scheduler.extraInitContainers rather than migrateDatabaseJob's:
# `airflow pools set` needs the pools table to exist, and migrateDatabaseJob's
# own initContainers run BEFORE its main container performs `airflow db
# migrate` — so provisioning there could race the migration on a fresh DB.
# The scheduler deployment only starts once migrations have completed, so
# provisioning here is safe, and `airflow pools set` is idempotent, so
# re-running it on every scheduler pod (re)start is harmless.
#
# NOTE: the repo URL and tag below MUST be kept in sync with the `connections:
# github_configs` host and `tracking_ref` in DAG BUNDLE CONFIGURATION above.

# ==============================================================================
# LOGGING
# ==============================================================================
logs:
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: managed-premium

# ==============================================================================
# POSTGRESQL (Metadata Database)
# ==============================================================================
postgresql:
  enabled: true
  auth:
    username: airflow
    password: <use-k8s-secret>
    database: airflow
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: managed-premium

# ==============================================================================
# ISTIO GATEWAY & VIRTUALSERVICE (Applied separately)
# ==============================================================================
# apiVersion: networking.istio.io/v1beta1
# kind: Gateway
# metadata:
#   name: airflow-gateway
# spec:
#   selector:
#     istio: ingressgateway
#   servers:
#     - port:
#         number: 80
#         name: http
#         protocol: HTTP
#       hosts:
#         - "airflow.yourdomain.com"
# ---
# apiVersion: networking.istio.io/v1beta1
# kind: VirtualService
# metadata:
#   name: airflow-vs
# spec:
#   hosts:
#     - "airflow.yourdomain.com"
#   gateways:
#     - airflow-gateway
#   http:
#     - match:
#         - uri:
#             prefix: /
#       route:
#         - destination:
#             host: airflow-webserver
#             port:
#               number: 8080

# ==============================================================================
# RBAC
# ==============================================================================
rbac:
  create: true
  createSCCRoleBinding: false  # Not needed for AKS

# ==============================================================================
# SERVICE ACCOUNT
# ==============================================================================
serviceAccount:
  create: true
  name: airflow
  annotations:
    # Azure managed identity for accessing ACR, and (see PERSISTENT VOLUMES
    # above) the same UAMI used by the Blob CSI driver for the
    # dataframe-storage volume's Workload Identity auth.
    azure.workload.identity/client-id: "<workload-identity-client-id>"

# The SA annotation above is necessary but NOT sufficient for AKS Workload
# Identity — every POD that needs the federated token (any pod mounting
# dataframe-storage: scheduler, apiServer, workers) also needs the label
# `azure.workload.identity/use: "true"` on the pod itself, or AKS's
# mutating webhook won't inject AZURE_CLIENT_ID/AZURE_TENANT_ID/
# AZURE_FEDERATED_TOKEN_FILE and the Blob CSI mount will fail to auth.
# TODO(verify): confirm the official chart's exact field for this against
# its values.schema.json — likely `workers.podLabels` / `scheduler.podLabels`
# / `apiServer.podLabels`, or a single chart-wide `labels:` merged into every
# pod template depending on chart version. Validate with
# `helm template ... | grep -A5 "kind: Pod"` before relying on it.
# labels:
#   azure.workload.identity/use: "true"

# ==============================================================================
# MONITORING & OBSERVABILITY
# ==============================================================================
# Metrics exported via statsd exporter for Grafana
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
