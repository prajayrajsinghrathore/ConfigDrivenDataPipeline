# RLAM Airflow Framework - Configuration-Driven Data Pipeline
# Python package for shared Airflow utilities

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlam-airflow-framework"
version = "1.0.0"
description = "RLAM Configuration-Driven Data Pipeline Framework for Airflow 3.x"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary - Royal London Asset Management"}
authors = [
    {name = "RLAM Data Platform Team", email = "dataplatform@rlam.co.uk"}
]
keywords = ["airflow", "etl", "data-pipeline", "config-driven", "rlam"]

# Runtime dependencies - match your requirements.txt
dependencies = [
    "apache-airflow>=3.3.0",
    "apache-airflow-task-sdk>=1.3.0",
    "pandas>=2.4.2",
    "numpy>=2.4.2",
    "pyyaml>=6.0.2",
    "structlog>=24.1.0",
    "pendulum>=3.0.0",
    "tenacity>=9.0.0",
    "simpleeval>=1.0.3",
    "numexpr>=2.14.1",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
]

# Optional dependencies for different features
[project.optional-dependencies]
snowflake = [
    "apache-airflow-providers-snowflake>=5.10.1",
    "snowflake-connector-python>=4.1.0",
]
azure = [
    "apache-airflow-providers-microsoft-azure>=12.4.0",
    "azure-storage-blob>=12.28.0",
    "azure-storage-file-datalake>=12.20.0",
    "adlfs<=2025.8.0",
]
kafka = [
    "confluent-kafka>=2.13.0",
    "kafka-python>=2.3.0",
]
quality = [
    # soda-core commented out due to Python 3.12 incompatibility
    # "soda-core>=3.2.0",
]
ssh = [
    "apache-airflow-providers-ssh>=3.15.0",
    "paramiko>=3.5.0",
]
http = [
    "apache-airflow-providers-http>=6.0.4",
]
all = [
    "rlam-airflow-framework[snowflake,azure,kafka,ssh,http]",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.5.1",
    "build>=1.0.0",
    "wheel>=0.42.0",
    "twine>=4.0.2",
]

[project.urls]
Homepage = "https://dev.azure.com/rlam/DataPlatform/_git/airflow-framework"
Documentation = "https://rlam.sharepoint.com/sites/DataPlatform/airflow"
Repository = "https://dev.azure.com/rlam/DataPlatform/_git/airflow-framework"

# Setuptools configuration
[tool.setuptools]
packages = [
    "rlam_airflow_framework",
    "rlam_airflow_framework.destinations",
    "rlam_airflow_framework.data_quality",
    "rlam_airflow_framework.data_fetchers",
    "rlam_airflow_framework.transformers",
    "rlam_airflow_framework.transformers.enrichments",
    "rlam_airflow_framework.formula_engine",
    "rlam_airflow_framework.formula_engine.evaluators",
]

[tool.setuptools.package-data]
rlam_airflow_framework = ["py.typed"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]

[tool.pyright]
extraPaths = []
